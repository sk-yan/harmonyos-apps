name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# HarmonyOS SDK builds and device tests run in the developer's licensed environment.
# This hosted job verifies the shared ledger core and browser preview.
jobs:
  core-and-preview:
    name: Ledger core and browser preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run ledger core and storage tests
        run: npm test

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Build browser preview
        run: npm run build:preview

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/yibi-ledger/tests/requirements.txt

      - name: Test native project preparation tools
        run: npm run test:tools

      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r apps/yibi-ledger/tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run browser acceptance checks
        id: browser
        run: npm run test:preview --workspace @harmonyos-apps/yibi-ledger

      - name: Upload browser reports and screenshots
        if: ${{ !cancelled() && steps.browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yibi-ledger-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/yibi-ledger/artifacts/preview/**
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
